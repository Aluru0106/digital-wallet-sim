# Default-deny ingress, then allow only TCP 8000 to the app pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paylite-allow-http-only
  namespace: paylite
spec:
  podSelector: {matchLabels: {app: paylite}}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8000}
