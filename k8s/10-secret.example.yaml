# EXAMPLE ONLY - do not commit real values. Create the real Secret with:
#   kubectl -n paylite create secret generic paylite-secrets \
#     --from-literal=JWT_SECRET=$(openssl rand -base64 48) \
#     --from-literal=HMAC_SECRET=$(openssl rand -base64 48) \
#     --from-literal=ADMIN_USERNAME=admin --from-literal=ADMIN_PASSWORD='<strong password>'
apiVersion: v1
kind: Secret
metadata:
  name: paylite-secrets
  namespace: paylite
type: Opaque
stringData:
  JWT_SECRET: "<generated>"
  HMAC_SECRET: "<generated>"
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "<generated>"
